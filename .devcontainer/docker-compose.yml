# Devcontainer overlay. Adds the `app` workspace container to the dev stack
# defined in ../docker-compose.dev.yaml (postgres + redis).
# Its own project with unpublished databases, so it runs beside the main dev stack
# and seeds its own database; the environment overrides a host-shaped backend/.env.
name: request-manager-devcontainer
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    # Source is resolved relative to the FIRST compose file's directory
    # (../docker-compose.dev.yaml at the repo root), so `.` is the repo root.
    volumes:
      - .:/workspaces/request-manager:cached
    command: sleep infinity
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - DATABASE_NAME=request_manager_db
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - CACHE_REDIS=redis://redis:6379/0
      - CELERY_BROKER=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    ports: !reset []

  redis:
    ports: !reset []
