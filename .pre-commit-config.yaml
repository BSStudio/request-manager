ci:
  autoupdate_branch: 'main'
  # Renovate updates the hooks inside its windows; this only catches what it misses.
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        name: 'Detect private keys'
      - id: check-merge-conflict
        name: 'Check for merge conflicts'
      - id: trailing-whitespace
        name: 'Trim trailing whitespaces'
      - id: end-of-file-fixer
        name: 'End files with a single newline'
        # The OpenAPI generator rewrites these without one on every run.
        exclude: ^frontend/src/api/(\.npmignore|\.openapi-generator/VERSION)$
      - id: mixed-line-ending
        name: 'Replace mixed line endings'
        args: [--fix=lf]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-renovate
  - repo: local
    hooks:
      - id: sync-additional-dependencies
        name: 'Sync additional_dependencies'
        entry: python .pre-commit/sync-additional-dependencies.py
        language: python
        files: (^.pre-commit/)|(package.json$)
        additional_dependencies:
          - pyyaml==6.0.3
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.4
    hooks:
      - id: uv-lock
        name: 'Verify that uv.lock is consistent with pyproject.toml'
        files: ^backend/(pyproject\.toml|uv\.lock)$
        args: [--project, ./backend, --check]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        name: 'Upgrade Python syntax to newer versions'
        args: [--py315-plus]
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        name: 'Upgrade Django syntax to newer versions'
        args: [--target-version, '6.1']
  - repo: https://github.com/hadialqattan/pycln
    rev: v2.6.0
    hooks:
      - id: pycln
        name: 'Remove unused Python imports'
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
        name: 'Sort Python imports'
        args: [--settings, ./backend/pyproject.toml]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        name: 'Format Python code'
  - repo: https://github.com/rtts/djhtml
    rev: 3.0.11
    hooks:
      - id: djhtml
        name: 'Format Django templates'
        files: ^backend/templates/
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        name: 'Lint Python code'
        args: [--toml-config=./backend/pyproject.toml]
        additional_dependencies:
          - Flake8-pyproject
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: 'Check Python security issues'
        args: [-c, ./backend/pyproject.toml]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        name: 'Format JavaScript and TypeScript code'
        exclude: (^backend/templates/)|((uv\.lock|package(-lock)?\.json|pnpm-lock\.yaml)$)
        exclude_types:
          - python
        args: [--config, ./frontend/.prettierrc]
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.12.0
    hooks:
      - id: eslint
        name: 'Lint TypeScript code'
        files: ^frontend/
        types:
          - text
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
        args: [
            --config,
            ./frontend/eslint.config.cjs,
            --rule,
            'import-x/no-unresolved:
            off',
            --fix,
          ]
        additional_dependencies:
          - '@eslint/js@10.0.1'
          - '@tanstack/eslint-plugin-query@5.104.2'
          - eslint-config-prettier@10.1.8
          - eslint-import-resolver-typescript@4.4.5
          - eslint-plugin-import-x@4.17.1
          - eslint-plugin-prettier@5.5.7
          - eslint-plugin-react-hooks@7.1.1
          - eslint-plugin-react@7.37.5
          - eslint@10.12.0
          - globals@17.13.0
          - prettier@3.9.10
          - typescript-eslint@8.71.2
          - typescript@6.0.3
