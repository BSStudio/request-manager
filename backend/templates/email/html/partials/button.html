<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 8px 0 24px">
    <tr>
        <td
            align="center"
            bgcolor="{% if secondary %}#ffffff{% else %}#005baa{% endif %}"
            style="border-radius: 8px;{% if secondary %} border: 1px solid #005baa;{% endif %}"
        >
            <a
                href="{{ url }}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                       display: inline-block;
                       padding: 12px 24px;
                       border-radius: 8px;
                       font-size: 16px;
                       line-height: 24px;
                       font-weight: 600;
                       color: {% if secondary %}#005baa{% else %}#ffffff{% endif %};
                       text-decoration: none;
                      "
            >{{ label }}</a>
        </td>
    </tr>
</table>
