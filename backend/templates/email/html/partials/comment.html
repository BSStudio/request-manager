{% load i18n %}
{% load static %}
{% load extra_tags %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 24px">
    <tr>
        <td width="44" valign="top" style="width: 44px; padding: 2px 12px 0 0">
            <img
                src="{% if avatar_url %}{{ avatar_url }}{% else %}{% settings_value "BASE_URL" %}{% static "images/default_avatar.png" %}{% endif %}"
                alt=""
                width="44"
                height="44"
                style="display: block; width: 44px; height: 44px; border: 0; border-radius: 50%"
            />
        </td>
        <td valign="top">
            <p style="margin: 0; font-size: 15px; line-height: 22px">
                <strong style="color: #0f1b2d">{{ name }}</strong>
                <span style="color: #64748b">
                    &middot; {% language 'hu' %}{{ comment.created|date:"F j. H:i" }}{% endlanguage %}
                </span>
                {% if comment.internal %}
                    {% include "email/html/partials/pill.html" with label="Belső" tone="amber" %}
                {% endif %}
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 8px; border-collapse: separate">
                <tr>
                    <td
                        bgcolor="{% if comment.internal %}#fff8e8{% else %}#f1f5f9{% endif %}"
                        style="padding: 12px 16px; border-radius: 4px 14px 14px 14px; font-size: 15px; line-height: 24px; color: #1e293b"
                    >{{ comment.text|linebreaksbr }}</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
