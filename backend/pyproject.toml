[project]
name = "request-manager-backend"
version = "0.0.0"
authors = [
    {name = "Olivér Kecskeméty", email = "kecskemety.oliver@simonyi.bme.hu"}
]
description = "Workflow Support System for managing video shooting, filming and live streaming requests of Budavári Schönherz Stúdió."
requires-python = ">=3.15,<4.0"
dependencies = [
    "celery[redis]==5.6.3",
    "django==6.0.9",
    "djangorestframework==3.18.3",
    "django-cacheops==7.2",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "django-cors-headers==4.9.0",
    "django-filter==26.2",
    "django-health-check[celery,redis]==4.11.1",
    "django-phonenumber-field[phonenumbers]==9.0.0",
    "django-simple-history==3.13.0",
    "drf-spectacular==0.30.0",
    "google-api-python-client==2.201.0",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "jsonschema[format]==4.26.0",
    "libgravatar==1.0.4",
    "python-decouple==3.8",
    "pywebpush==2.5.0",
    "requests==2.34.2",
    "sentry-sdk==2.73.0",
    "social-auth-app-django==7.2.0",
    "whitenoise[brotli]==6.12.0"
]

[dependency-groups]
ci = ["pytest-github-actions-annotate-failures==0.4.2"]
debug = ["django-debug-toolbar==8.0.0"]
dev = [
    "pre-commit==4.7.0",
    "psycopg[binary]==3.3.6"
]
prod = [
    "gunicorn==26.2.0",
    "psycopg[c]==3.3.6"
]
test = [
    "model_bakery==1.24.2",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "pytest-xdist[psutil]==3.8.0",
    "responses==0.26.3",
    "time-machine==3.6.0"
]

[tool.coverage.report]
fail_under = 90
ignore_errors = true
show_missing = true
skip_covered = true
omit = [
    "conftest.py",
    "core/*",
    "tests/*",
    "*/migrations/*",
    "*/admin.py",
    "manage.py",
]
exclude_lines = [
    "pragma: no cover",
    'if getattr.*"swagger_fake_view".*',
    "return .*[.]none[(][)]]",
]

[tool.coverage.run]
branch = true
source = ["."]

[tool.bandit]
exclude_dirs = ["tests", "core/settings/ci.py"]

[tool.flake8]
max-line-length = 88
max-complexity = 15
ignore = ["E203", "E501", "W503"]
per-file-ignores = [
    "backend/core/settings/*.py: F403,F405",
    "backend/common/apps.py: F401",
    "backend/video_requests/apps.py: F401"
]

[tool.isort]
profile = "black"

[tool.uv]
default-groups = ["debug", "dev", "test"]

[tool.pytest]
addopts = ["--cov", "--cov-report=html", "--cov-report=term", "--cov-report=xml", "-n=auto"]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["test_*.py", "*_tests.py"]
markers = [
    "emails: renders a real e-mail; --save-emails writes these to logs/emails.",
]
