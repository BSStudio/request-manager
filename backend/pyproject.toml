[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "request-manager-backend"
authors = [
    {name = "Olivér Kecskeméty", email = "kecskemety.oliver@simonyi.bme.hu"}
]
description = "Workflow Support System for managing video shooting, filming and live streaming requests of Budavári Schönherz Stúdió."
requires-python = ">=3.14,<4.0"
dependencies = [
    "celery[redis]==5.6.3",
    "django==6.0.7",
    "djangorestframework==3.17.1",
    "djangorestframework_simplejwt==5.5.1",
    "django-cacheops==7.2",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "django-cors-headers==4.9.0",
    "django-filter==26.1",
    "django-health-check[celery,redis]==4.4.3",
    "django-phonenumber-field[phonenumbers]==8.5.0",
    "django-simple-history==3.13.0",
    "drf-spectacular==0.30.0",
    "google-api-python-client==2.198.0",
    "google-auth-httplib2==0.4.0",
    "google-auth-oauthlib==1.4.0",
    "jsonschema[format]==4.26.0",
    "libgravatar==1.0.4",
    "python-decouple==3.8",
    "requests==2.34.2",
    "sentry-sdk==2.66.1",
    "social-auth-app-django==6.0.0",
    "whitenoise[brotli]==6.12.0"
]

[tool.coverage.report]
fail_under = 90
ignore_errors = true
show_missing = true
skip_covered = true
omit = [
    "core/*",
    "tests/*",
    "*/migrations/*",
    "*/admin.py",
    "*/tests.py",
    "manage.py",
]
exclude_lines = [
    "pragma: no cover",
    'if getattr.*"swagger_fake_view".*',
    "return .*[.]none[(][)]]",
]

[tool.coverage.run]
branch = true
source = ["."]

[tool.bandit]
exclude_dirs = ["tests", "core/settings/ci.py"]

[tool.flake8]
max-line-length = 88
max-complexity = 15
ignore = ["E203", "E501", "W503"]
per-file-ignores = [
    "backend/core/settings/*.py: F403,F405",
    "backend/common/apps.py: F401",
    "backend/video_requests/apps.py: F401"
]

[tool.isort]
profile = "black"

[tool.poetry]
package-mode = false

[tool.poetry.group.ci]
optional = true

[tool.poetry.group.ci.dependencies]
pytest-github-actions-annotate-failures = "0.4.2"

[tool.poetry.group.debug.dependencies]
django-debug-toolbar = "7.0.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "4.6.1"
psycopg = {extras = ["binary"], version = "3.3.4"}

[tool.poetry.group.prod]
optional = true

[tool.poetry.group.prod.dependencies]
gunicorn = "26.0.0"
psycopg = {extras = ["c"], version = "3.3.4"}

[tool.poetry.group.test.dependencies]
model_bakery = "1.24.0"
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-django = "4.12.0"
pytest-xdist = {extras = ["psutil"], version = "3.8.0"}
responses = "0.26.2"
time-machine = "3.2.0"
typing_extensions = "4.16.0" # TODO: Remove when social-core no longer supports Python 3.9

[tool.pytest]
addopts = ["--cov", "--cov-report=html", "--cov-report=term", "--cov-report=xml", "-n=auto"]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
