name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: BSStudio/.github/.github/workflows/shared-checks.yml@14e6deaf34d65dd4db67c19f146449c1cf99c1cc # v1.3.0
    with:
      dependency-review: true
