name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: BSStudio/.github/.github/workflows/shared-checks.yml@1bee7a7ec6481ec9b591405f76c94a6bdbc4b688 # v1.1.1
    with:
      dependency-review: true
