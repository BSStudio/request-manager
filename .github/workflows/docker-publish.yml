name: Docker

on:
  push:
    branches: [main]
    # Publish semver tags as releases.
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bsstudio/request-manager

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Mint the OIDC token and write the build provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Sentry reads package@version names as semantic versions.
      - name: Name the Sentry release
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=request-manager@${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SENTRY_RELEASE=${{ steps.release.outputs.name }}
          # Missing on pull requests from forks; the build then skips the upload.
          secrets: SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance handled by the attest step below; buildkit's own
          # attestations would push untagged "unknown/unknown" manifests to ghcr.
          provenance: false
          sbom: false

      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          # Keep the attestation in GitHub's store only; pushing to ghcr would add
          # an untagged referrer artifact. Verify with:
          #   gh attestation verify oci://<image> --owner BSStudio
          push-to-registry: false
