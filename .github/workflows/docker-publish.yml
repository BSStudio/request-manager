name: Docker

on:
  push:
    branches: [main]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: Docker
    uses: BSStudio/.github/.github/workflows/shared-publish.yml@14e6deaf34d65dd4db67c19f146449c1cf99c1cc # v1.3.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    secrets:
      sentry-auth-token: ${{ github.ref_type == 'tag' && secrets.SENTRY_AUTH_TOKEN || '' }}

  sentry-release:
    name: Create Sentry release
    needs: docker
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Sentry release
        uses: getsentry/action-release@d55c8c3b7375607e972b710f12926b676d89d7d2 # v3.8.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: budavari-schonherz-studio
        with:
          projects: request-manager-backend request-manager-frontend
          release: request-manager@${{ needs.docker.outputs.version }}
          disable_telemetry: true
