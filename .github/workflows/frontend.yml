name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  run-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint config check and lint
        run: |
          pnpm run check-eslint-config
          pnpm run lint
      - name: Run tests
        run: pnpm test run --coverage --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          files: frontend/coverage/coverage-final.json
          flags: frontend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          files: frontend/junit.xml
          flags: frontend
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Build
        run: pnpm run build
        env:
          CI: ''
