name: Backend CI

on:
  workflow_dispatch:
    inputs:
      run-tests:
        description: Run all backend tests
        required: false
        default: true
        type: boolean
      generate-emails:
        description: Generate downloadable test e-mails
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  run-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: core.settings.ci

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked --group ci

      - name: Check for model changes without migration
        run: uv run python manage.py makemigrations --check

      - name: Synchronize database state and collect static files
        run: |
          uv run python manage.py migrate --no-input
          uv run python manage.py collectstatic --no-input --clear --link

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-tests == 'true'
        run: uv run pytest --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-tests == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: backend/
          flags: backend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        # Failed runs too: their results are what test analytics is for.
        if: "!cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.run-tests == 'true')"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/junit.xml
          flags: backend
          report_type: test_results
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive code coverage results
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-tests == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage-report
          path: backend/htmlcov/

      - name: Generate e-mail artifacts
        if: github.event.inputs.generate-emails == 'true'
        env:
          BASE_URL_DOMAIN: felkeres.bsstudio.hu
        run: uv run pytest -m emails --save-emails --no-cov

      - name: Archive sent e-mails
        if: github.event.inputs.generate-emails == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emails
          path: backend/logs/emails/
